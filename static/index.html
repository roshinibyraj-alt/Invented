<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Candle-Pattern Bot — BTC 5m</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080b10;--panel:#12161c;--panel2:#171c24;--line:#1e2531;
  --text:#e7ecf3;--muted:#8b96a8;--faint:#4d5866;
  --green:#33d6a6;--red:#ff5d73;--amber:#f0a63c;--blue:#5b9bf5;
  --g-bg:rgba(51,214,166,.08);--r-bg:rgba(255,93,115,.08);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --head:'Space Grotesk',ui-sans-serif,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--head);
  min-height:100vh;padding:12px 14px 60px;font-size:14px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:2px 0 6px}
header h1{font-size:17px;margin:0;font-weight:700}
header .sub{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.pill{display:flex;align-items:center;gap:6px;font-size:11px;padding:5px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-family:var(--mono)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.bad{background:var(--red)}

.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel)}
.pcard .lbl{font-size:9.5px;letter-spacing:1.5px;color:var(--faint);font-family:var(--mono)}
.pcard .big{font-size:24px;font-weight:700;font-family:var(--mono);margin-top:2px}
.pcard.up .big{color:var(--green)}.pcard.dn .big{color:var(--red)}
.pcard .det{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}

.candles{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.candles h3{font-size:10px;letter-spacing:1px;color:var(--faint);font-family:var(--mono);text-transform:uppercase;margin:0 0 8px}
.candle-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:var(--mono)}
.candle{width:52px;height:56px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.candle .num{font-size:9px;color:var(--faint)}
.candle .col{font-size:16px;font-weight:700}
.candle.green{border-color:rgba(51,214,166,.4);background:var(--g-bg)}
.candle.green .col{color:var(--green)}
.candle.red{border-color:rgba(255,93,115,.4);background:var(--r-bg)}
.candle.red .col{color:var(--red)}
.candle.flat .col{color:var(--faint)}
.candle.building{border-style:dashed;opacity:.6}
.vs{font-size:11px;color:var(--muted);font-family:var(--mono)}
.sig{font-size:11px;font-family:var(--mono);margin-top:8px;color:var(--muted)}
.sig b{color:var(--text)}
.sig .up{color:var(--green)}.sig .dn{color:var(--red)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.st .k{font-size:9px;letter-spacing:1px;color:var(--faint);font-family:var(--mono);text-transform:uppercase}
.st .v{font-size:18px;font-weight:700;font-family:var(--mono);margin-top:2px}
.st .v.pos{color:var(--green)}.st .v.neg{color:var(--red)}
.st .s{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}

.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pnl{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px}
.pnl h3{font-size:10px;letter-spacing:1px;color:var(--faint);font-family:var(--mono);text-transform:uppercase;margin:0 0 8px}

.badge{display:inline-block;font-size:9.5px;letter-spacing:.8px;padding:3px 8px;border-radius:8px;font-family:var(--mono);font-weight:600}
.badge.mon{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.badge.rec{background:rgba(157,140,245,.12);color:#9d8cf5;border:1px solid rgba(157,140,245,.25)}
.badge.pos{background:var(--g-bg);color:var(--green);border:1px solid rgba(51,214,166,.25)}

.pw{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12px;margin-top:8px;display:flex;flex-direction:column;gap:4px}
.pw .r{display:flex;justify-content:space-between;color:var(--muted)}
.pw .r b{color:var(--text)}

.eq{height:110px}
.eq .empty{color:var(--faint);font-family:var(--mono);font-size:10px;text-align:center;padding-top:35px}

section h3{font-size:10px;letter-spacing:1px;color:var(--faint);font-family:var(--mono);text-transform:uppercase;margin:0 0 6px}
.lg{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:380px}
.lg table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10.5px}
.lg th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:7px 10px;color:var(--faint);font-weight:600;letter-spacing:.5px}
.lg td{padding:5px 10px;border-top:1px solid var(--line);color:var(--muted);vertical-align:top}
.lg .ts{white-space:nowrap;color:var(--faint)}
.lg .ev{color:var(--text);white-space:nowrap;font-weight:500}
.lg .note{max-width:440px;color:var(--faint);font-size:10px}

.lg tr.win{background:var(--g-bg)}.lg tr.loss{background:var(--r-bg)}
.lg tr.win td{color:var(--green)}.lg tr.loss td{color:var(--red)}
.lg tr.win .note,.lg tr.loss .note{color:var(--muted)}

.pnl-pos{color:var(--green);font-weight:700}.pnl-neg{color:var(--red);font-weight:700}

@media(max-width:700px){.prices,.mg{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🕯️ Candle-Pattern Bot</h1>
      <div class="sub">BTC 5m paper · 5× 1-min candles from UP mid · signal: candle 3 ≠ candle 2 · green 3rd → BUY UP · red 3rd → BUY DOWN · TP 0.99</div>
    </div>
    <div class="pill"><span class="dot" id="dot"></span><span id="stxt">connecting…</span></div>
  </header>

  <div class="prices">
    <div class="pcard up"><div class="lbl">BTC UP</div><div class="big" id="upP">—</div><div class="det" id="upB"></div></div>
    <div class="pcard dn"><div class="lbl">BTC DOWN</div><div class="big" id="dnP">—</div><div class="det" id="dnB"></div></div>
  </div>

  <div class="candles">
    <h3>1-Minute Candles (UP mid as basis)</h3>
    <div class="candle-row" id="candleRow"></div>
    <div class="sig" id="sigInfo"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="mg">
    <div class="pnl">
      <h3>Status</h3>
      <div id="statusBadge"></div>
      <div id="posCard"></div>
    </div>
    <div class="pnl">
      <h3>Equity</h3>
      <div class="eq" id="eqCurve"></div>
    </div>
  </div>

  <section>
    <h3>Trade Log</h3>
    <div class="lg"><table><thead><tr>
      <th>Time</th><th>Event</th><th>Side</th><th>Price</th><th>Shares</th><th>Fee</th><th>P&L</th><th>Balance</th><th>Note</th>
    </tr></thead><tbody id="logBody"></tbody></table></div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const M=n=>n==null?'—':Number(n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:4});
const $U=n=>n==null?'—':Number(n).toLocaleString(undefined,{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
const T=ts=>new Date(ts*1000).toISOString().slice(11,19);
const pnlCls=n=>n==null?'':n>=0?'pnl-pos':'pnl-neg';
const rowCls=r=>r.event==='TP_HIT'||r.event==='RESOLUTION_WIN'?'win':r.event==='RESOLUTION_LOSS'?'loss':'';

function render(s){
  const p=s.prices||{};
  $('upP').textContent=p.up==null?'—':p.up.toFixed(3);
  $('dnP').textContent=p.down==null?'—':p.down.toFixed(3);
  const b=s.book||{};
  $('upB').textContent=b.up_bid!=null?`bid ${M(b.up_bid)} / ask ${M(b.up_ask)}`:'';
  $('dnB').textContent=b.down_bid!=null?`bid ${M(b.down_bid)} / ask ${M(b.down_ask)}`:'';

  const w=s.window;
  $('stxt').textContent=s.status==='running'?(w?`live · ${Math.max(0,Math.round(w.seconds_to_close))}s left`:'running'):s.status;
  $('dot').className='dot '+((s.error||s.status!=='running')?'bad':'ok');

  const e=s.engine||{};

  // candles
  const colors=e.candle_colors||[];
  const building=e.building==null?-1:e.building;
  let cr='';
  for(let i=0;i<(e.def?e.def.pattern_candles:3);i++){
    const col=colors[i];
    const isBuilding=(i===building && col===undefined);
    const cls=col?col:(isBuilding?'building':'flat');
    const label=col?col.toUpperCase():(isBuilding?'…':'—');
    cr+=`<div class="candle ${cls}"><div class="num">C${i+1}</div><div class="col">${label}</div></div>`;
  }
  $('candleRow').innerHTML=cr;

  let sig='';
  if(e.position){
    sig=`signal matched → <b class="${e.position.side==='UP'?'up':'dn'}">${e.position.side === 'UP' ? 'BUY UP' : 'BUY DOWN'}</b> · ${M(e.position.shares)}sh @ ${M(e.position.entry_price)}`;
  } else if(e.signal_fired){
    sig='pattern evaluated · no matching signal this window';
  } else if(colors.length>=2){
    sig=`need ${(e.def?e.def.pattern_candles:3)-colors.length} more candle(s)`+
        ` · candle 3 ≠ 2 · green 3rd → <b class="up">UP</b> · red 3rd → <b class="dn">DOWN</b>`;
  } else {
    sig=`building candle ${(colors.length+1)} of ${(e.def?e.def.pattern_candles:3)} · candle 3 ≠ 2 · green 3rd → <b class="up">UP</b> · red 3rd → <b class="dn">DOWN</b>`;
  }
  $('sigInfo').innerHTML=sig;

  // stats
  const tiles=[
    ['Balance',$U(e.balance),e.balance>=4500?`+$${(e.balance-4500).toFixed(0)}`:`-$${(4500-e.balance).toFixed(0)}`],
    ['Realized P&L',$U(e.total_pnl),e.total_pnl>=0?'win':'loss',e.total_pnl>=0?'pos':'neg'],
    ['Unrealized',$U(e.unrealized_pnl),'',e.unrealized_pnl>=0?'pos':'neg'],
    ['Wins / Losses',`${e.total_wins??0} / ${e.total_losses??0}`,e.win_rate?`${e.win_rate}% win`:''],
    ['Entries',e.total_entries??0,`tp ${e.total_tp_hits??0}`],
    ['Last P&L',$U(e.last_window_pnl),'',e.last_window_pnl>=0?'pos':'neg'],
  ];
  $('stats').innerHTML=tiles.map(([k,v,s,vc])=>`<div class="st"><div class="k">${k}</div><div class="v ${vc||''}">${v}</div><div class="s">${s}</div></div>`).join('');

  // status badge
  let badge='';
  if(e.status==='in_position') badge='<span class="badge pos">IN POSITION</span>';
  else if(e.status==='building_candles') badge='<span class="badge rec">BUILDING CANDLES</span>';
  else if(e.status==='done_signal') badge='<span class="badge mon">SIGNAL DONE</span>';
  else badge='<span class="badge mon">MONITORING</span>';
  $('statusBadge').innerHTML=badge;

  // position card
  let pos='';
  const pp=e.position;
  if(pp){
    const c=pp.unrealized_pnl>=0?'pnl-pos':'pnl-neg';
    pos=`<div class="pw">
      <div class="r"><span style="font-weight:700;color:${pp.side==='UP'?'var(--green)':'var(--red)'}">${pp.side} ${M(pp.shares)}sh</span><span class="${c}">${$U(pp.unrealized_pnl)}</span></div>
      <div class="r"><span>entry</span><b>${M(pp.entry_price)}</b></div>
      <div class="r"><span>mark</span><b>${M(pp.mark)}</b></div>
      <div class="r"><span>cost</span><b>${$U(pp.cost)}</b></div>
    </div>`;
  }
  $('posCard').innerHTML=pos;

  // equity curve
  const el=$('eqCurve');
  const cv=e.equity_curve||[];
  if(cv.length<2){el.innerHTML='<div class="empty">equity curve starts after the first settled window</div>';return;}
  const W=el.clientWidth||400,H=110;
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"></svg>`;
  const svg=el.querySelector('svg');
  const vs=cv.map(p=>p.balance);
  let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<1){mx+=1;mn-=1;}
  const X=i=>i/(vs.length-1)*W;
  const Y=v=>H-4-(v-mn)/(mx-mn)*(H-8);
  const d=cv.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.balance).toFixed(1)}`).join(' ');
  const col=vs[vs.length-1]>=vs[0]?'var(--green)':'var(--red)';
  svg.innerHTML=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2"/>`;
  svg.innerHTML+=`<text x="6" y="14" fill="var(--muted)" font-size="10" font-family="monospace">${$U(vs[0])} → ${$U(vs[vs.length-1])}</text>`;

  // log
  const rows=s.log||[];
  const tb=$('logBody');
  if(!rows.length){tb.innerHTML='<tr><td colspan="9"><div style="padding:16px;text-align:center;color:var(--faint);font-family:var(--mono);font-size:11px">No events yet</div></td></tr>';return;}
  tb.innerHTML=rows.map(r=>{
    const cls=rowCls(r);
    const pnlStr=r.pnl==null?'':$U(r.pnl);
    const pnlC=r.pnl==null?'':r.pnl>=0?'pnl-pos':'pnl-neg';
    return `<tr class="${cls}">
      <td class="ts">${T(r.ts)}</td>
      <td class="ev">${r.event.replace(/_/g,' ')}</td>
      <td>${r.side||'—'}</td>
      <td>${r.price==null?'—':M(r.price)}</td>
      <td>${r.shares==null?'—':M(r.shares)}</td>
      <td>${r.fee==null?'—':M(r.fee)}</td>
      <td class="${pnlC}">${pnlStr||'—'}</td>
      <td>${r.balance_after==null?'—':$U(r.balance_after)}</td>
      <td class="note">${r.note||''}</td>
    </tr>`;
  }).join('');
}

async function poll(){
  try{const r=await fetch('/api/state');const s=await r.json();render(s);}
  catch(e){$('stxt').textContent='offline';$('dot').className='dot bad';}
}
setInterval(poll,1000);
poll();
</script>
</body>
</html>
