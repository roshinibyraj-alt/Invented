<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BTC 5m · 94¢ Entry · Paper</title>
<meta name="description" content="BTC 5-minute paper bot: 300 shares at a 94-cent ask, 90-cent bid stop and official settlement target.">
<meta property="og:title" content="BTC 5m · 94¢ Entry · Paper">
<meta property="og:description" content="Flat 300-share paper trading, realistic taker fills and fees, and official resolution.">
<style>
:root{
  --paper:#f2ede2; --card:#fbf8f1; --ink:#1d1a16; --mute:#6b6357; --line:#d9d0bf;
  --sat:#e8860c; --satdeep:#9a5300; --up:#0f7a5c; --upbg:#e1efe7; --down:#b2342a; --downbg:#f6e2dc;
  --warn:#8a5a00; --warnbg:#fbecc8; --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(60,40,10,.08) 1px,transparent 1px);background-size:3px 3px}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 60px;position:relative}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 0 16px;border-bottom:3px solid var(--ink)}
.mark{width:34px;height:34px;border-radius:50%;background:var(--sat);display:grid;place-items:center;color:var(--card);font-weight:800;font-size:18px;box-shadow:inset 0 0 0 3px var(--satdeep)}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.tag{font-family:var(--mono);font-size:13px;font-weight:700;padding:4px 9px;border-radius:4px;border:1.5px solid var(--ink);letter-spacing:.06em}
.tag.paper{background:var(--sat);border-color:var(--satdeep);color:#24160a}
.conn{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--up);animation:pulse 2s ease-out infinite}.dot.bad{background:var(--down)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,122,92,.45)}100%{box-shadow:0 0 0 10px rgba(15,122,92,0)}}
.banner{margin:12px 0 0;padding:11px 14px;border-radius:8px;font-size:15px;line-height:1.4;border-left:5px solid}
.banner.err{background:var(--downbg);border-color:var(--down);color:#6a1a12}
.banner.warn{background:var(--warnbg);border-color:var(--sat);color:#5a3a00}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
/* Cards refresh with live data; do not replay entrance animations on each poll. */
.tf{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.tfhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--ink);color:var(--paper)}
.tfname{font-family:var(--mono);font-size:30px;font-weight:800;color:var(--sat);line-height:1}
.mtitle{font-size:14px;color:#cfc6b4;margin-top:6px;line-height:1.3}
.clock{text-align:right}
.clock .num{font-size:34px;font-weight:700;line-height:1}
.clock small{display:block;font-size:13px;color:#cfc6b4;margin-top:4px}
.bar{height:5px;background:#3a342c}.bar i{display:block;height:100%;background:var(--sat);transform-origin:left;transition:transform 1s linear}
.sec{padding:14px 16px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.lbl{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.asks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ask{border-radius:10px;padding:12px;border:2px solid transparent;transition:border-color .2s}
.ask.up{background:var(--upbg);color:var(--up)}.ask.down{background:var(--downbg);color:var(--down)}
.ask.pick{border-color:currentColor}
.ask .side{font-weight:800;font-size:15px;letter-spacing:.08em;display:flex;justify-content:space-between}
.ask .px{font-family:var(--mono);font-size:42px;font-weight:700;line-height:1.1;margin-top:4px;color:var(--ink)}
.ask .sub{font-size:14px;color:var(--mute);margin-top:2px}
.prob{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.prob .big{font-family:var(--mono);font-size:38px;font-weight:700}
.meter{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--down) 0,var(--down) 50%,var(--up) 50%,var(--up) 100%);opacity:.9;margin:10px 0 4px}
.meter .th{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.meter .nd{position:absolute;top:-5px;width:6px;height:24px;margin-left:-3px;border-radius:3px;background:var(--ink);border:2px solid var(--card);transition:left .6s ease}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px}
@media(min-width:520px){.kv.k3{grid-template-columns:repeat(3,1fr)}}
.kv div{min-width:0}
.kv b{display:block;font-family:var(--mono);font-size:20px;font-weight:700;overflow-wrap:anywhere}
.kv span{font-size:13px;color:var(--mute)}
.status{font-size:15px;line-height:1.4;padding:10px 12px;border-radius:8px;background:#efe8da}
.status.go{background:var(--warnbg);color:#5a3a00;font-weight:600}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.04em;font-family:var(--mono)}
.pill.ok{background:var(--upbg);color:var(--up)}.pill.no{background:var(--downbg);color:var(--down)}.pill.w{background:var(--warnbg);color:var(--warn)}
.pos{border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-top:8px}
.pos h4{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pos.up{border-left:6px solid var(--up)}.pos.down{border-left:6px solid var(--down)}
.pnlp{color:var(--up)}.pnln{color:var(--down)}
.empty{font-size:15px;color:var(--mute);padding:14px;border:1.5px dashed var(--line);border-radius:10px;text-align:center}
svg.chart{width:100%;height:170px;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:5px}
.trades{width:100%;border-collapse:collapse;font-size:14px}
.trades th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:6px 4px;border-bottom:1.5px solid var(--line)}
.trades td{padding:8px 4px;border-bottom:1px solid var(--line);font-family:var(--mono);vertical-align:top}
.trades tr.w td:first-child{box-shadow:inset 4px 0 var(--up)}.trades tr.l td:first-child{box-shadow:inset 4px 0 var(--down)}
.tscroll{overflow-x:auto;max-height:340px;overflow-y:auto}
details summary{cursor:pointer;font-size:15px;font-weight:600;padding:4px 0}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.panel h2{font-size:18px;margin:0 0 10px}
.events{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.events li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.events time{font-family:var(--mono);color:var(--mute);flex:none}
.explain p,.explain li{font-size:15px;line-height:1.55}
.explain ul{padding-left:20px}
footer{font-size:14px;color:var(--mute);margin-top:18px;line-height:1.5}
.skel{background:linear-gradient(90deg,#e8e1d2,#f3eee3,#e8e1d2);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:8px;height:22px;margin:6px 0}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="mark">B</div>
  <h1 id="title">BTC 5m · 94¢ entry / 90¢ stop</h1>
  <span class="tag paper">PAPER</span>
  <span class="tag" id="botStatus">—</span>
  <div class="conn"><span class="dot" id="dot"></span><span id="connText">Connecting…</span></div>
</header>
<div id="connBanner" class="banner err hidden"></div>
<div id="errBanner" class="banner err hidden"></div>
<div id="modelBanner" class="banner warn hidden"></div>
<div id="persistBanner" class="banner warn hidden"></div>

<div class="grid" id="grid">
  <section class="tf"><div class="sec"><div class="skel"></div><div class="skel"></div><div class="skel" style="height:80px"></div></div></section>
  <section class="tf"><div class="sec"><div class="skel"></div><div class="skel"></div><div class="skel" style="height:80px"></div></div></section>
</div>

<section class="panel"><h2>Bot events</h2><ul class="events" id="events"><li class="empty">No events yet.</li></ul></section>

<section class="panel explain" id="explain"><h2>How this strategy works</h2><div id="explainBody"></div></section>
<footer>Paper simulation only. Nothing here is an order on a real account, and no result shown is a promise of future profit.</footer>
</div>

<script>
'use strict';
const TFS=['5m'];
const API=new URL('api/state',document.baseURI.replace(/[^/]*$/,'')).toString();
let state=null,lastOk=0,fails=0,lastErr='',clockSkew=0,polling=false;
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fin=v=>typeof v==='number'&&Number.isFinite(v);
const usd=(v,d=2)=>fin(v)?(v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const sUsd=v=>fin(v)?(v>=0?'+':'')+usd(v):'—';
const cents=v=>fin(v)?(v*100).toFixed(1)+'¢':'—';
const pct=(v,d=1)=>fin(v)?(v*100).toFixed(d)+'%':'—';
const n=(v,d=2)=>fin(v)?v.toFixed(d):'—';
const pc=v=>fin(v)?(v>0?'pnlp':v<0?'pnln':''):'';
const tm=t=>fin(t)?new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
const dt=t=>fin(t)?new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
const nowS=()=>Date.now()+clockSkew;
function age(t){if(!fin(t))return '—';const s=Math.max(0,(nowS()-t)/1000);return s<60?s.toFixed(0)+'s ago':s<3600?Math.floor(s/60)+'m '+Math.floor(s%60)+'s ago':(s/3600).toFixed(1)+'h ago'}
function mmss(ms){if(!fin(ms))return '—';ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function pill(st){const ok=['READY','RUNNING'].includes(st),no=['ERROR','VALIDATION_REJECTED'].includes(st);return `<span class="pill ${ok?'ok':no?'no':'w'}">${esc(st||'UNKNOWN')}</span>`}

async function poll(){
  if(polling)return;
  polling=true;
  try{
    const r=await fetch(API,{cache:'no-store',credentials:'include',signal:AbortSignal.timeout(10000)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!j||typeof j!=='object')throw new Error('Malformed response');
    state=j;lastOk=Date.now();fails=0;lastErr='';
    if(fin(j.now))clockSkew=j.now-Date.now();
    render();
  }catch(e){fails++;lastErr=e.message||String(e);}
  finally{polling=false;}
  conn();
}
function conn(){
  const ok=fails===0&&lastOk;
  $('dot').className='dot '+(ok?'ok':(lastOk||fails)?'bad':'');
  $('connText').textContent=ok?'Live · '+tm(lastOk):fails?'Disconnected':'Connecting…';
  const b=$('connBanner');
  if(fails){b.classList.remove('hidden');b.textContent=`Cannot reach ${API} (${lastErr}). ${fails} failed attempt${fails>1?'s':''}. `+(lastOk?`Numbers below are stale, last good update ${age(lastOk-clockSkew+clockSkew)}.`:'No data received yet.');}
  else b.classList.add('hidden');
}

function render(){
  const s=state;
  $('title').textContent=s.strategy?.name||'BTC 5m · 94¢ entry / 90¢ stop';
  $('botStatus').textContent=s.status||'—';
  const eb=$('errBanner');
  if(s.lastError||s.status==='ERROR'){eb.classList.remove('hidden');eb.textContent='Bot '+(s.status==='ERROR'?'status ERROR':'last error')+': '+(s.lastError||'unknown');}else eb.classList.add('hidden');
  const m=s.model||{},mb=$('modelBanner');
  if(m.status&&m.status!=='RUNNING'){mb.classList.remove('hidden');mb.innerHTML=`Model service ${pill(m.status)} ${esc(m.message||'')} — no entries are taken without a fresh validated prediction.`;}
  else mb.classList.add('hidden');
  const p=s.persistence||{},pb=$('persistBanner');
  if(p.error){pb.classList.remove('hidden');pb.textContent='Ledger save failing: '+p.error;}
  else if(p.enabled===false){pb.classList.remove('hidden');pb.textContent='Ledger persistence disabled: paper history resets on restart.';}
  else pb.classList.add('hidden');
  const opened=[...$('grid').querySelectorAll('details')].map(d=>d.open);
  const scrolls=[...$('grid').querySelectorAll('.tscroll')].map(d=>[d.scrollLeft,d.scrollTop]);
  $('grid').innerHTML=TFS.map(tf=>card(tf)).join('');
  $('grid').querySelectorAll('details').forEach((d,i)=>{d.open=opened[i]||false;});
  $('grid').querySelectorAll('.tscroll').forEach((d,i)=>{if(scrolls[i]){d.scrollLeft=scrolls[i][0];d.scrollTop=scrolls[i][1];}});
  renderEvents();renderExplain();tick();
}

function card(tf){
  const s=state,rec=s.markets?.[tf]||{},mk=rec.market,acc=s.accounts?.[tf],mod=s.model?.models?.[tf]||{};
  const pr=mod.prediction,met=mod.metrics;
  const pick=pr&&fin(pr.pUp)?(pr.pUp>=pr.pDown?'UP':'DOWN'):null;
  const q=rec.quotes||{};
  const askBox=side=>{const x=q[side];const cls=side==='UP'?'up':'down';
    return `<div class="ask ${cls} ${pick===side?'pick':''}"><div class="side"><span>${side}</span><span>${pick===side?'MODEL SIDE':''}</span></div>
    <div class="px">${x&&fin(x.bestAsk)?cents(x.bestAsk):'—'}</div>
    <div class="sub">ask · bid ${x&&fin(x.bestBid)?cents(x.bestBid):'—'}</div>
    <div class="sub" data-age="${x?.updatedAt??''}">${x?age(x.updatedAt):'no book'}</div></div>`};
  const minP=s.strategy?.minimumProbability??.58;
  const conf=pr&&pick?(pick==='UP'?pr.pUp:pr.pDown):null;
  const go=/Qualifying|Filled/.test(rec.status||'');
  return `<section class="tf">
  <div class="tfhead"><div><div class="tfname">BTC ${esc(tf)}</div><div class="mtitle">${mk?esc(mk.title):'Discovering market…'}</div></div>
   <div class="clock"><div class="num" data-end="${mk?.end??''}">—</div><small>${mk?tm(mk.start)+' – '+tm(mk.end):'no window'}</small></div></div>
  <div class="bar"><i data-s="${mk?.start??''}" data-e="${mk?.end??''}" style="transform:scaleX(0)"></i></div>
  <div class="sec"><div class="lbl">Executable asks</div><div class="asks">${askBox('UP')}${askBox('DOWN')}</div></div>
  <div class="sec"><div class="lbl">Flat sizing · price-only strategy</div>
    <div class="kv k3"><div><b style="font-size:32px">300</b><span>shares per entry</span></div>
    <div><b>94¢</b><span>ask trigger</span></div><div><b>90¢</b><span>bid stop</span></div></div></div>
  <div class="sec"><div class="lbl">Bot decision</div><div class="status ${go?'go':''}">${esc(rec.status||'—')}</div>
   ${rec.pending?`<div class="kv" style="margin-top:8px"><div><b>${esc(rec.pending.side)}</b><span>pending side</span></div><div><b>${tm(rec.pending.at)}</b><span>signal seen</span></div></div>`:''}</div>
  ${account(tf,acc)}
  ${mk?`<div class="sec"><details><summary>Market identifiers</summary><div class="kv" style="margin-top:8px;font-size:13px"><div><b style="font-size:14px">${esc(mk.id)}</b><span>market id</span></div><div><b style="font-size:14px">${esc(mk.slug)}</b><span>slug</span></div><div><b style="font-size:12px">${esc(mk.tokens?.UP)}</b><span>UP token</span></div><div><b style="font-size:12px">${esc(mk.tokens?.DOWN)}</b><span>DOWN token</span></div></div></details></div>`:''}
  </section>`;
}

function account(tf,a){
  if(!a)return `<div class="sec"><div class="empty">Account data unavailable.</div></div>`;
  const pos=(a.positions||[]).map(p=>{const m=p.mark;const cls=p.side==='UP'?'up':'down';
    return `<div class="pos ${cls}"><h4><span style="color:var(--${cls})">${esc(p.side)} · ${n(p.shares)} sh</span>${p.status==='AWAITING_RESOLUTION'?'<span class="pill w">PENDING OFFICIAL RESOLUTION</span>':`<span class="pill ok">${esc(p.status)}</span>`}</h4>
    <div class="kv k3"><div><b>${cents(p.entryPrice)}</b><span>avg entry</span></div><div><b>${usd(p.cost)}</b><span>cost</span></div><div><b>${usd(p.fees,4)}</b><span>fees</span></div>
    <div><b>${m&&fin(m.bid)?cents(m.bid):'—'}</b><span>best bid</span></div><div><b>${m&&fin(m.value)?usd(m.value):'—'}</b><span>mark (depth, net fee)</span></div>
    <div><b class="${pc(p.unrealizedPnl)}">${sUsd(p.unrealizedPnl)}</b><span>unrealized P&amp;L</span></div>
    <div><b>90¢</b><span>stop trigger (bid)</span></div><div><b>$1</b><span>official winning payout</span></div><div><b>${tm(p.openedAt)}</b><span>opened</span></div>
    ${m&&fin(m.unpricedShares)&&m.unpricedShares>1e-6?`<div><b>${n(m.unpricedShares)}</b><span>shares without bid depth</span></div>`:''}</div>
    ${!m?'<div class="sub" style="margin-top:6px;color:var(--mute);font-size:14px">No fresh mark; equity shown as unknown rather than guessed.</div>':''}</div>`}).join('');
  const h=a.history||[];
  const rows=h.map(p=>`<tr class="${p.pnl>0?'w':p.pnl<0?'l':''}"><td style="color:var(--${p.side==='UP'?'up':'down'});font-weight:700">${esc(p.side)}</td><td>${tm(p.openedAt)}<br><span style="color:var(--mute)">${dt(p.windowStart)}</span></td><td>${n(p.shares)}</td><td>${cents(p.entryPrice)}</td><td>${fin(p.exitPrice)?'$'+p.exitPrice.toFixed(4):'—'}<br><span style="color:var(--mute)">${esc(p.status)}${p.winner?' · '+esc(p.winner):''}</span></td><td>${usd(p.fees,3)}</td><td class="${pc(p.pnl)}" style="font-weight:700">${sUsd(p.pnl)}</td><td>${tm(p.closedAt)}</td></tr>`).join('');
  return `<div class="sec"><div class="lbl">Paper account · separate ${usd(a.initialCapital,0)}</div>
   <div class="kv k3"><div><b>${usd(a.cash)}</b><span>cash</span></div><div><b>${usd(a.settledBalance)}</b><span>settled balance</span></div>
   <div><b>${a.equity==null?'unknown':usd(a.equity)}</b><span>floating equity${a.valuationComplete===false?' (mark missing)':''}</span></div>
   <div><b class="${pc(a.realizedPnl)}">${sUsd(a.realizedPnl)}</b><span>realized P&amp;L</span></div><div><b class="${pc(a.unrealizedPnl)}">${sUsd(a.unrealizedPnl)}</b><span>unrealized P&amp;L</span></div>
   <div><b>${usd(a.fees,3)}</b><span>total fees</span></div><div><b>${a.wins??0} / ${a.losses??0}</b><span>wins / losses</span></div><div><b>${a.totalClosed??0}</b><span>closed trades</span></div><div><b>${usd(a.knownPositionValue)}</b><span>known position value</span></div></div></div>
  <div class="sec"><div class="lbl">Open position</div>${pos||'<div class="empty">Flat. At most one entry per window.</div>'}</div>
  <div class="sec"><div class="lbl">Equity · ${esc(tf)}</div>${chart(a.equityCurve||[])}</div>
  <div class="sec"><div class="lbl">Closed trades · stops and settlement</div>${h.length?`<div class="tscroll"><table class="trades"><thead><tr><th>Side</th><th>Entry / window</th><th>Sh</th><th>Entry</th><th>Exit</th><th>Fees</th><th>P&amp;L</th><th>Closed</th></tr></thead><tbody>${rows}</tbody></table></div>${a.totalClosed>h.length?`<div class="legend">Showing latest ${h.length} of ${a.totalClosed}.</div>`:''}`:'<div class="empty">No closed trades yet.</div>'}</div>`;
}

function chart(c){
  const pts=c.filter(p=>p&&fin(p.at));
  if(pts.length<2)return '<div class="empty">Equity samples appear every 15 seconds. Not enough samples yet.</div>';
  const W=600,H=170,L=58,R=8,T=10,B=24;
  const t0=pts[0].at,t1=pts[pts.length-1].at||t0+1;
  const vals=pts.flatMap(p=>[p.equity,p.settledBalance]).filter(fin);
  if(!vals.length)return '<div class="empty">No valued equity samples yet.</div>';
  let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<1){lo-=.5;hi+=.5}
  const pad=(hi-lo)*.08;lo-=pad;hi+=pad;
  const x=t=>L+(t-t0)/Math.max(1,t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const gapMs=60000;
  const path=k=>{let d='',prev=null;for(const p of pts){const v=p[k];if(!fin(v)){prev=null;continue}
    const brk=!prev||p.at-prev.at>gapMs;d+=(brk?'M':'L')+x(p.at).toFixed(1)+' '+y(v).toFixed(1)+' ';prev=p;}return d};
  const ticks=[lo+pad,(lo+hi)/2,hi-pad].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#d9d0bf" stroke-dasharray="3 4"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#6b6357" font-family="monospace">${v.toFixed(0)}</text>`).join('');
  const xt=[t0,(t0+t1)/2,t1].map((t,i)=>`<text x="${x(t)}" y="${H-6}" text-anchor="${['start','middle','end'][i]}" font-size="12" fill="#6b6357" font-family="monospace">${new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</text>`).join('');
  const nulls=pts.filter(p=>!fin(p.equity)).length;
  return `<svg class="chart" role="img" aria-label="Paper equity and settled balance in US dollars over actual elapsed time; unknown marks are gaps" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><title>Equity and settled balance (USD)</title>${ticks}${xt}
   <path d="${path('settledBalance')}" fill="none" stroke="#9a5300" stroke-width="1.6" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
   <path d="${path('equity')}" fill="none" stroke="#1d1a16" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg>
   <div class="legend"><span><i style="background:var(--ink)"></i>floating equity</span><span><i style="background:var(--satdeep)"></i>settled balance</span><span>${pts.length} samples${nulls?` · ${nulls} unvalued (gaps)`:''}</span></div>`;
}

function validation(m,status){
  if(!m)return `<div class="sec"><div class="lbl">Model validation ${pill(status)}</div><div class="empty">Model is training or has not reported validation yet.</div></div>`;
  const better=fin(m.testBrier)&&fin(m.baselineBrier)&&m.testBrier<m.baselineBrier;
  return `<div class="sec"><div class="lbl">Model validation ${pill(status)}</div>
   <div class="kv k3"><div><b class="${better?'pnlp':'pnln'}">${n(m.testBrier,4)}</b><span>test Brier</span></div><div><b>${n(m.baselineBrier,4)}</b><span>baseline Brier</span></div>
   <div><b>${fin(m.testBrier)&&fin(m.baselineBrier)?(m.baselineBrier-m.testBrier>=0?'-':'+')+Math.abs(m.baselineBrier-m.testBrier).toFixed(4):'—'}</b><span>vs baseline (lower better)</span></div>
   <div><b>${n(m.testLogLoss,4)}</b><span>test log loss</span></div><div><b>${pct(m.testAccuracy)}</b><span>test accuracy</span></div><div><b>${age(m.trainedAt)}</b><span>trained</span></div>
   <div><b>${m.trainWindows??'—'} / ${m.calibrationWindows??'—'} / ${m.testWindows??'—'}</b><span>train / calib / test windows</span></div><div><b>${m.testSnapshots??'—'}</b><span>test snapshots</span></div></div>
   <div class="status" style="margin-top:10px;font-size:14px">${esc(m.split||'')}<br><b>Labels:</b> ${esc(m.labelSource||'Binance proxy')}</div>
   ${Array.isArray(m.bins)&&m.bins.length?`<details style="margin-top:8px"><summary>Reliability bins</summary><table class="trades"><thead><tr><th>Bin</th><th>n</th><th>Predicted</th><th>Actual</th></tr></thead><tbody>${m.bins.map(b=>`<tr><td>${pct(b.from,0)}+</td><td>${b.count}</td><td>${pct(b.predicted)}</td><td>${pct(b.actual)}</td></tr>`).join('')}</tbody></table></details>`:''}</div>`;
}

function renderEvents(){
  const ev=state.events||[];
  $('events').innerHTML=ev.length?ev.slice(0,60).map(e=>`<li><time>${tm(e.at)}</time><span>${esc(e.message)}</span></li>`).join(''):'<li class="empty">No events yet.</li>';
}
function renderExplain(){
  const s=state.strategy||{};
  $('explainBody').innerHTML=`<p>BTC 5-minute markets only. Fresh $1,500 paper account. No prediction model, flips, recovery or 15-minute trades.</p><ul>
  <li><b>Entry rule:</b> whichever side's best ask reaches or exceeds 94¢. Buy exactly 300 shares once per window, only with sufficient cash and visible ask depth.</li>
  <li><b>Realistic fills:</b> a ${s.latencyMs??500} ms minimum delay and a later fresh book are required. Actual sweep prices can exceed 94¢ and incur taker fees. Insufficient depth or cash means wait, not smaller sizing.</li>
  <li><b>Stop:</b> held best bid at or below 90¢ triggers a market sale after latency. Partial exits and worse prices are possible; the bot continues selling the remainder. No re-entry that window.</li>
  <li><b>Target:</b> $1 is the official winning settlement payout, not a guaranteed $1 market sell. Expired positions wait for official UP/DOWN resolution; losing shares pay $0.</li>
  <li><b>Exit:</b> ${esc(s.exit||'')}</li></ul>
  <p><b>${esc(s.warning||'Research paper experiment. No guaranteed edge.')}</b></p>
  <p style="color:var(--mute)">Strategy id ${esc(s.id||'—')} · mode ${esc(state.mode||'PAPER')} · ledger saved ${age(state.persistence?.lastSavedAt)}</p>`;
}

function tick(){
  const t=nowS();
  document.querySelectorAll('[data-end]').forEach(el=>{const e=+el.dataset.end;el.textContent=el.dataset.end?mmss(e-t):'—';});
  document.querySelectorAll('i[data-s]').forEach(el=>{const s=+el.dataset.s,e=+el.dataset.e;if(el.dataset.s&&e>s)el.style.transform=`scaleX(${Math.min(1,Math.max(0,(t-s)/(e-s)))})`;});
  document.querySelectorAll('[data-age]').forEach(el=>{const a=+el.dataset.age;if(el.dataset.age)el.textContent=age(a);});
  if(fails)conn();
}
setInterval(tick,1000);
poll();setInterval(poll,2000);
</script>
</body>
</html>
