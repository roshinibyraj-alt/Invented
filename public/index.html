<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>4-candle streak bot — REAL capital</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14171c; --border: #262b33; --text: #e8ebf0; --dim: #8891a0;
    --mint: #35d399; --coral: #ff6b6b; --amber: #f5b942;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .warn { background: #3a1c1c; border: 1px solid var(--coral); color: var(--coral); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-weight: 600; }
  .err { background: #3a1c1c; border: 1px solid var(--coral); color: var(--coral); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .tile .n { font-size: 22px; font-weight: 700; }
  .tile .l { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .pos { color: var(--mint); } .neg { color: var(--coral); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
  .panel h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--dim); font-weight: 600; }
  .ev-ENTRY_FILLED { color: var(--amber); } .ev-SETTLED_WIN { color: var(--mint); } .ev-SETTLED_LOSS { color: var(--coral); }
  .ev-ERROR { color: var(--coral); } .ev-VOID, .ev-NO_TRADE, .ev-WAIT { color: var(--dim); } .ev-SIGNAL, .ev-FIRING { color: var(--amber); } .ev-MISMATCH { color: var(--coral); }
  .addr { font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim); word-break: break-all; }
</style>
</head>
<body>
  <h1>4-candle streak bot</h1>
  <div class="warn">⚠️ REAL CAPITAL — every fill here is a live Polymarket trade with real funds.</div>
  <div id="errBanner" class="err"></div>

  <div class="grid">
    <div class="tile"><div class="n" id="wallet">—</div><div class="l">wallet balance (USDC)</div></div>
    <div class="tile"><div class="n" id="stakes">—</div><div class="l">next stake (shares) DOWN / UP</div></div>
    <div class="tile"><div class="n" id="realizedPnl">—</div><div class="l">realized P&amp;L (est.)</div></div>
    <div class="tile"><div class="n" id="winRate">—</div><div class="l">win rate (W / L)</div></div>
    <div class="tile"><div class="n" id="candles">—</div><div class="l">last 4 closed candles</div></div>
    <div class="tile"><div class="n" id="winStatus">—</div><div class="l">this window</div></div>
  </div>

  <div class="panel">
    <h2>Status</h2>
    <div id="statusLine" style="color: var(--dim)">loading…</div>
    <div class="addr" id="walletAddr"></div>
  </div>

  <div class="panel">
    <h2>Event log</h2>
    <table>
      <thead><tr><th>time</th><th>event</th><th>window</th><th>side</th><th>shares</th><th>pnl</th><th>note</th></tr></thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>

<script>
function fmtTime(ts) { return new Date(ts).toLocaleTimeString(); }
function fmtMoney(n) { return n == null ? '—' : (n >= 0 ? '+' : '') + '$' + n.toFixed(2); }

async function poll() {
  try {
    const res = await fetch('/api/state');
    const s = await res.json();

    const errEl = document.getElementById('errBanner');
    if (s.error) { errEl.style.display = 'block'; errEl.textContent = s.error; }
    else { errEl.style.display = 'none'; }

    document.getElementById('wallet').textContent = s.walletBalance == null ? '—' : '$' + s.walletBalance.toFixed(2);
    document.getElementById('stakes').textContent = s.stakes.DOWN + ' / ' + s.stakes.UP;
    const pnlEl = document.getElementById('realizedPnl');
    pnlEl.textContent = fmtMoney(s.stats.realizedPnl);
    pnlEl.className = 'n ' + (s.stats.realizedPnl >= 0 ? 'pos' : 'neg');

    const w = s.stats.wins, l = s.stats.losses;
    const wr = (w + l) > 0 ? ((100 * w / (w + l)).toFixed(1) + '%') : '—';
    document.getElementById('winRate').textContent = wr + ' (' + w + '/' + l + ')';

    const sig = s.lastSignal;
    document.getElementById('candles').innerHTML = sig
      ? sig.colors.map(c => '<span class="' + (c === 'GREEN' ? 'pos' : 'neg') + '">●</span>').join(' ') + (sig.side ? ' → ' + sig.side : '')
      : '—';

    const win = s.window;
    document.getElementById('winStatus').textContent = win
      ? win.status + (win.lastAsk != null && win.status === 'watching' ? ' (ask ' + win.lastAsk + ')' : '')
      : '—';

    document.getElementById('statusLine').textContent =
      'window ' + (win ? win.slug : '—') + ' · uptime ' + Math.floor(s.uptimeSec/60) + 'm '
      + (s.uptimeSec%60) + 's · pending ' + s.pending.length + ' · no-signal ' + s.stats.noSignal
      + ' · void (no trigger / no fill) ' + s.stats.voidNoTrigger + ' / ' + s.stats.voidNoFill;
    document.getElementById('walletAddr').textContent = s.walletAddress || '';

    const rows = s.log.map(e => {
      const cls = 'ev-' + e.event;
      return '<tr class="' + cls + '">' +
        '<td>' + fmtTime(e.ts) + '</td>' +
        '<td>' + e.event + '</td>' +
        '<td>' + (e.slug ? e.slug.replace('btc-updown-5m-', '') : '—') + '</td>' +
        '<td>' + (e.side || '—') + '</td>' +
        '<td>' + (e.shares != null ? e.shares : '—') + '</td>' +
        '<td>' + (e.pnl != null ? fmtMoney(e.pnl) : '—') + '</td>' +
        '<td>' + (e.note || '') + '</td>' +
      '</tr>';
    }).join('');
    document.getElementById('logBody').innerHTML = rows;
  } catch (e) {
    document.getElementById('statusLine').textContent = 'disconnected from bot process';
  }
}
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
